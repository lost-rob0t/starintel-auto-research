name: Finish Star-Lang research cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finish-star-lang-research-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Migrate field names and remove prototypes
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("roam/research/star-lang")
          docs = sorted(root.glob("STAR-LANG-RESEARCH-*.org"))
          if not docs:
              raise SystemExit("No Star-Lang research documents found")

          def camel(name: str) -> str:
              parts = re.split(r"[-_]", name)
              return parts[0] + "".join(part[:1].upper() + part[1:] for part in parts[1:] if part)

          # Field identifiers used by Star-Lang envelopes, lifecycle records,
          # transport records, manifests, and generated bindings. This list
          # intentionally excludes DSL forms, declaration/type names, compiler
          # options, restart names, and host-language function names.
          field_names = {
              "star-version", "spec-version", "schema-version", "library-version",
              "message-type", "message-id", "parent-message-id", "correlation-id",
              "causation-id", "idempotency-key", "deduplication-key", "reply-to",
              "trace-id", "span-id", "parent-span-id", "request-id", "response-id",
              "command-id", "operation-id", "delivery-id", "receipt-id", "settlement-id",
              "producer-id", "consumer-id", "transport-id", "actor-id", "actor-name",
              "source-actor", "destination-actor", "dataset-id", "document-id", "case-id",
              "entity-id", "domain-id", "server-id", "node-id", "host-id", "tool-id",
              "tool-name", "call-id", "session-id", "task-id", "job-id", "route-key",
              "partition-key", "sequence-number", "attempt-count", "retry-count",
              "created-at", "sent-at", "received-at", "updated-at", "added-at",
              "date-added", "date-updated", "expires-at", "deadline-at", "not-before",
              "valid-from", "valid-to", "effective-date", "content-type", "error-code",
              "error-message", "error-kind", "retry-after", "retry-after-ms",
              "nack-reason", "result-type", "payload-digest", "contract-digest",
              "manifest-digest", "source-ref", "source-url", "raw-source",
              "source-document", "output-document", "lease-id", "lease-until",
              "mailbox-name", "redelivery-count", "visible-at", "input-message-id",
              "input-kind", "dispatcher-result", "next-outcome-index",
              "target-message-id", "target-correlation-id"
          }

          replacements = {}
          for kebab in field_names:
              replacements[kebab] = camel(kebab)
              replacements[kebab.replace("-", "_")] = camel(kebab)

          field_decl = re.compile(r"^(\s*)\(([a-z][a-z0-9]*(?:[-_][a-z0-9]+)+)(?=\s)")

          changed = []
          for path in docs:
              original = path.read_text(encoding="utf-8")
              text = original

              # Document and message field declarations are the first symbol on
              # lines carrying :required or :optional. Type and declaration names
              # elsewhere remain unchanged.
              rewritten = []
              for line in text.splitlines(keepends=True):
                  if ":required" in line or ":optional" in line:
                      match = field_decl.match(line)
                      if match:
                          old = match.group(2)
                          new = camel(old)
                          line = line[:match.start(2)] + new + line[match.end(2):]
                  rewritten.append(line)
              text = "".join(rewritten)

              # Normalize known field identifiers only in explicit field-key
              # positions: Org inline code, Lisp keywords, and exact JSON/alist keys.
              for old in sorted(replacements, key=len, reverse=True):
                  new = replacements[old]
                  text = text.replace(f"={old}=", f"={new}=")
                  text = re.sub(r":" + re.escape(old) + r"\b", ":" + new, text)
                  text = text.replace(f'"{old}"', f'"{new}"')

              # Remove stale prose that explicitly endorsed hyphenated fields.
              text = text.replace(
                  "Hyphenated Star-Lang field names remain exact dictionary keys instead of being silently renamed.",
                  "Star-Lang field names use lower camelCase and remain exact dictionary keys; generators do not silently rename them."
              )
              text = text.replace("exact source field strings", "exact lower-camelCase source field strings")
              text = text.replace("quoted source field names", "lower-camelCase source field names")
              text = text.replace("Python preserves exact source keys", "Python preserves exact lower-camelCase source keys")

              if text != original:
                  if "#+last_modified:" not in text:
                      rows = text.splitlines(keepends=True)
                      index = next((i + 1 for i, row in enumerate(rows) if row.startswith("#+status:")), None)
                      if index is not None:
                          rows.insert(index, "#+last_modified: [2026-08-02 Sun]\n")
                          text = "".join(rows)
                  path.write_text(text, encoding="utf-8")
                  changed.append(path)

          failures = []
          for path in docs:
              text = path.read_text(encoding="utf-8")
              for number, line in enumerate(text.splitlines(), start=1):
                  if ":required" in line or ":optional" in line:
                      match = field_decl.match(line)
                      if match:
                          failures.append(f"{path}:{number}: field declaration {match.group(2)}")
              for old in replacements:
                  if f"={old}=" in text:
                      failures.append(f"{path}: inline field {old}")
                  if re.search(r":" + re.escape(old) + r"\b", text):
                      failures.append(f"{path}: keyword field {old}")
                  if f'"{old}"' in text:
                      failures.append(f"{path}: serialized field {old}")
              if "Hyphenated Star-Lang field names" in text:
                  failures.append(f"{path}: obsolete field-name policy")

          # Verify the approved amendment remains authoritative.
          approved = (root / "STAR-LANG-RESEARCH-008-core-surface-and-wire-protocol.org").read_text(encoding="utf-8")
          for required in (
              "#+status: APPROVED",
              "| 0.1.2   | 2026-08-02 | Adopt lower camelCase fields",
              "| Yes                   |",
              "Kebab-case field declarations are invalid",
          ):
              if required not in approved:
                  failures.append(f"research 008 missing: {required}")

          if failures:
              raise SystemExit("\n".join(failures))

          print("Updated research documents:")
          for path in changed:
              print(path)
          PY

          rm -rf prototypes/star-lang
          rm -f star-lang-hyphenated-token-audit.txt
          rm -f .github/workflows/finish-star-lang-research-cleanup.yml

          test ! -e prototypes/star-lang
          test ! -e star-lang-hyphenated-token-audit.txt

          git config user.name "starintel-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A roam/research/star-lang prototypes/star-lang star-lang-hyphenated-token-audit.txt .github/workflows/finish-star-lang-research-cleanup.yml
          git commit -m "docs(star-lang): use camelCase fields and remove prototypes"
          git push origin HEAD:main
