name: Child Identity Firewall

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Compile firewall
        run: python -m py_compile scripts/child_identity_firewall.py

      - name: Run privacy boundary tests
        run: python -m unittest discover -s tests -p 'test_child_identity_firewall.py' -v
