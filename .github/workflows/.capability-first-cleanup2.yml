name: Capability-first cleanup review

on:
  push:
    branches:
      - agent/capability-first-cleanup

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/capability-first-cleanup
          fetch-depth: 0
      - run: python3 scripts/.capability_first_cleanup2.py
      - run: |
          git config user.name "starintel-auto-research[bot]"
          git config user.email "starintel-auto-research[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No review changes were produced"
            exit 1
          fi
          git commit -m "Complete capability-first cleanup"
          git push origin HEAD:agent/capability-first-cleanup
