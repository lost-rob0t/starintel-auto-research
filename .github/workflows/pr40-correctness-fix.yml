name: PR 40 correctness fix

on:
  push:
    branches:
      - agent/capability-first-cleanup
    paths:
      - ".github/workflows/pr40-correctness-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/capability-first-cleanup
          fetch-depth: 0

      - name: Restore correctness invariants
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path.cwd()

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old!r}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          agents = root / "AGENTS.md"
          replace_once(
              agents,
              "Approval gates, audits, permissions, allowlists, retention rules, rate policies, resource policies, review queues, redaction, and deployment governance are optional modules selected by the operator or product deployment. They are not universal prerequisites, mandatory document fields, or limits on the core capability model.\n\nResearch must first identify the strongest technically achievable capability.",
              "Approval gates, audits, permissions, allowlists, retention rules, rate policies, resource policies, review queues, redaction, and deployment governance are optional modules selected by the operator or product deployment. They are not universal prerequisites, mandatory document fields, or limits on the core capability model.\n\nParser, type, schema, transport-termination, and renderer-output correctness invariants are not deployment-policy modules. Generated artifacts must be deterministically validated before becoming typed documents or executable plans; actor and expert-system outputs must satisfy their schemas; poison inputs must reach a terminal reject or dead-letter outcome; untrusted rendered fields must be sanitized or escaped; and lifecycle, provenance, integrity, and processing semantics required for deterministic replay must be preserved.\n\nResearch must first identify the strongest technically achievable capability.",
          )
          replace_once(
              agents,
              "5. Keep lifecycle, provenance, integrity, access, audit, retention, and processing metadata optional unless the active design explicitly requires them.\n6. Never fabricate sources, confidence, or evidence.",
              "5. Preserve lifecycle, provenance, integrity, and processing semantics required for deterministic validation, replay, and conflict resolution.\n6. Keep access, audit, retention, review, and deployment-policy metadata optional unless the active design explicitly requires them.\n7. Never fabricate sources, confidence, or evidence.",
          )

          ideas = root / "roam/design/STAR-00-Starintel-4th-generation-Ideas.org"
          replace_once(
              ideas,
              "**** TODO Optional deployment modules\n***** Preserve raw source\n***** Record publication and collection timestamps\n***** Optional licensing and retention metadata\n***** Distinguish quoted claims from verified facts\n***** Support structured LLM output\n***** Support deterministic validation\n***** Track model and prompt provenance",
              "**** TODO Correctness requirements\n***** Preserve raw source\n***** Record publication and collection timestamps\n***** Distinguish quoted claims from verified facts\n***** Require structured LLM output for typed artifacts\n***** Require deterministic validation before typed documents or executable plans are accepted\n***** Track model and prompt provenance\n\n**** TODO Optional deployment modules\n***** Optional licensing and retention metadata",
          )
          replace_once(
              ideas,
              "**** TODO Optional deployment modules\n***** Distinguish facts from conclusions\n***** Preserve rule provenance\n***** Record complete proof paths\n***** Limit recursion and inference time\n***** Optional case-isolation policy\n***** Support deterministic replay\n***** Support schema validation",
              "**** TODO Correctness requirements\n***** Distinguish facts from conclusions\n***** Preserve rule provenance\n***** Record complete proof paths\n***** Support deterministic replay\n***** Require schema validation at the language boundary\n\n**** TODO Optional deployment modules\n***** Optional inference resource limits\n***** Optional case-isolation policy",
          )

          text = ideas.read_text(encoding="utf-8")
          dead_letter = "***** Optional dead-letter handling"
          count = text.count(dead_letter)
          if count != 2:
              raise SystemExit(f"{ideas}: expected two dead-letter matches, found {count}")
          text = text.replace(
              dead_letter,
              "***** Terminal rejection or dead-letter handling for poison inputs",
          )
          text = text.replace(
              "**** TODO Optional HTML sanitization",
              "**** TODO HTML sanitization for untrusted document fields",
              1,
          )
          text = text.replace(
              "**** TODO Optional output escaping",
              "**** TODO Output escaping for generated views",
              1,
          )
          ideas.write_text(text, encoding="utf-8")

          workflow = root / ".github/workflows/pr40-correctness-fix.yml"
          workflow.unlink()
          PY

      - name: Validate patch
        run: |
          git diff --check
          grep -F "Require deterministic validation before typed documents or executable plans are accepted" roam/design/STAR-00-Starintel-4th-generation-Ideas.org
          grep -F "Require schema validation at the language boundary" roam/design/STAR-00-Starintel-4th-generation-Ideas.org
          test "$(grep -Fc "Terminal rejection or dead-letter handling for poison inputs" roam/design/STAR-00-Starintel-4th-generation-Ideas.org)" -eq 2
          grep -F "HTML sanitization for untrusted document fields" roam/design/STAR-00-Starintel-4th-generation-Ideas.org
          grep -F "Output escaping for generated views" roam/design/STAR-00-Starintel-4th-generation-Ideas.org

      - name: Commit fix
        run: |
          git config user.name "starintel-auto-research[bot]"
          git config user.email "starintel-auto-research[bot]@users.noreply.github.com"
          git add AGENTS.md roam/design/STAR-00-Starintel-4th-generation-Ideas.org .github/workflows/pr40-correctness-fix.yml
          git commit -m "Restore runtime correctness invariants"
          git push origin HEAD:agent/capability-first-cleanup
