name: Migrate Star-Lang research fields to camelCase

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/migrate-star-lang-fields-to-camelcase.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rewrite Star-Lang research field identifiers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("roam/research/star-lang")
          docs = sorted(root.glob("STAR-LANG-RESEARCH-*.org"))
          if not docs:
              raise SystemExit("No Star-Lang research documents found")

          def camel(name: str) -> str:
              parts = name.split("-")
              return parts[0] + "".join(part[:1].upper() + part[1:] for part in parts[1:])

          # These are serialized or envelope field identifiers, not DSL forms or
          # declaration/type/message/predicate/actor names.
          wire_fields = {
              "star-version", "spec-version", "schema-version", "library-version",
              "message-type", "message-id", "parent-message-id", "correlation-id",
              "causation-id", "idempotency-key", "deduplication-key", "reply-to",
              "trace-id", "span-id", "parent-span-id", "request-id", "response-id",
              "command-id", "operation-id", "delivery-id", "receipt-id", "settlement-id",
              "producer-id", "consumer-id", "transport-id", "actor-id", "actor-name",
              "source-actor", "destination-actor", "dataset-id", "document-id", "case-id",
              "entity-id", "candidate-id", "committee-id", "filing-id", "report-id",
              "transaction-id", "amendment-id", "previous-id", "original-id", "domain-id",
              "server-id", "node-id", "host-id", "tool-id", "tool-name", "call-id",
              "session-id", "task-id", "job-id", "route-key", "partition-key",
              "sequence-number", "attempt-count", "retry-count", "max-attempts",
              "created-at", "sent-at", "received-at", "updated-at", "added-at",
              "date-added", "date-updated", "expires-at", "deadline-at", "not-before",
              "valid-from", "valid-to", "effective-date", "content-type", "error-code",
              "error-message", "error-kind", "retry-after", "nack-reason", "result-type",
              "payload-digest", "contract-digest", "manifest-digest", "source-ref",
              "source-url", "raw-source", "source-document", "output-document",
              "lease-id", "lease-until", "mailbox-name"
          }

          field_decl = re.compile(r"^(\s*)\(([a-z][a-z0-9]*(?:-[a-z0-9]+)+)(?=\s)")
          quoted_key = re.compile(r'"([a-z][a-z0-9]*(?:-[a-z0-9]+)+)"(?=\s*(?:\.|:))')

          changed = []
          for path in docs:
              original = path.read_text(encoding="utf-8")
              text = original

              # User-defined document and message fields are the first item on
              # declaration lines carrying :required or :optional.
              out = []
              for line in text.splitlines(keepends=True):
                  if ":required" in line or ":optional" in line:
                      match = field_decl.match(line)
                      if match:
                          old = match.group(2)
                          line = line[:match.start(2)] + camel(old) + line[match.end(2):]
                  out.append(line)
              text = "".join(out)

              # Serialized map/JSON keys are field identifiers and must also be camelCase.
              text = quoted_key.sub(lambda m: '"' + camel(m.group(1)) + '"', text)

              # Standard wire-envelope plist keys used in research examples.
              for old in sorted(wire_fields, key=len, reverse=True):
                  text = re.sub(r":" + re.escape(old) + r"\b", ":" + camel(old), text)
                  text = re.sub(r"=" + re.escape(old) + r"=", "=" + camel(old) + "=", text)

              # Normalize prose that previously endorsed kebab-case field keys.
              text = text.replace(
                  "Hyphenated Star-Lang field names remain exact dictionary keys instead of being silently renamed.",
                  "Star-Lang field names use lower camelCase and remain exact dictionary keys; generators do not silently rename them."
              )
              text = text.replace("exact source field strings", "exact lower-camelCase source field strings")
              text = text.replace("quoted source field names", "lower-camelCase source field names")
              text = text.replace("Python preserves exact source keys", "Python preserves exact lower-camelCase source keys")
              text = text.replace("=message_type=", "=messageType=")

              if path.name == "STAR-LANG-RESEARCH-008-core-surface-and-wire-protocol.org":
                  marker = "* Concrete Surface\n"
                  naming = (
                      "* Field Naming\n\n"
                      "Star-Lang document fields, message-payload fields, and wire-envelope keys use lower camelCase. "
                      "Examples include =candidateId=, =messageId=, =correlationId=, and =replyTo=. "
                      "The compiler preserves these names exactly through normalized IR, manifests, serialization, and generated bindings.\n\n"
                      "DSL forms and named declarations are not fields. Forms and identifiers such as =spec-library=, "
                      "=ingest-page=, scalar/type names, predicates, and actors may remain kebab-case. "
                      "Kebab-case field declarations are invalid and must produce a structured compiler diagnostic.\n\n"
                  )
                  if naming not in text:
                      if marker not in text:
                          raise SystemExit("Could not locate Concrete Surface marker in research 008")
                      text = text.replace(marker, naming + marker, 1)

                  old_table = (
                      "| Version | Date       | Description of change                                      | Did nsaspy approve it |\n"
                      "|---------+------------+------------------------------------------------------------+-----------------------|\n"
                      "| 0.1.1   | 2026-08-02 | Record nsaspy approval of core surface and wire protocol   | Yes                   |\n"
                      "| 0.1.0   | 2026-07-22 | Define core surface and initial language-neutral protocol  | Superseded            |"
                  )
                  new_table = (
                      "| Version | Date       | Description of change                                                | Did nsaspy approve it |\n"
                      "|---------+------------+----------------------------------------------------------------------+-----------------------|\n"
                      "| 0.1.2   | 2026-08-02 | Adopt lower camelCase fields across surface and wire contracts       | Yes                   |\n"
                      "| 0.1.1   | 2026-08-02 | Record nsaspy approval of core surface and wire protocol             | Superseded            |\n"
                      "| 0.1.0   | 2026-07-22 | Define core surface and initial language-neutral protocol            | Superseded            |"
                  )
                  if old_table in text:
                      text = text.replace(old_table, new_table, 1)
                  elif "| 0.1.2   | 2026-08-02 | Adopt lower camelCase fields" not in text:
                      raise SystemExit("Unexpected research 008 version table")

              if path.name == "STAR-LANG-RESEARCH-009-canonical-json-and-generated-bindings.org":
                  marker = "* Canonical JSON\n"
                  naming = (
                      "* Field Naming\n\n"
                      "All document fields, message-payload fields, and serialized envelope keys use lower camelCase. "
                      "Canonical JSON and generated bindings preserve the source spelling exactly; they do not translate kebab-case fields at generation time. "
                      "A kebab-case field is rejected during parsing or semantic validation. Declaration and type identifiers remain outside this rule.\n\n"
                  )
                  if naming not in text:
                      if marker not in text:
                          raise SystemExit("Could not locate Canonical JSON marker in research 009")
                      text = text.replace(marker, naming + marker, 1)
                  if "14. kebab-case field declarations fail before binding generation" not in text:
                      text = text.replace(
                          "13. generated Python bindings compile\n",
                          "13. generated Python bindings compile\n14. kebab-case field declarations fail before binding generation\n",
                          1,
                      )

              if text != original:
                  if "#+last_modified:" not in text:
                      lines = text.splitlines(keepends=True)
                      insert_at = next((i + 1 for i, line in enumerate(lines) if line.startswith("#+status:")), None)
                      if insert_at is not None:
                          lines.insert(insert_at, "#+last_modified: [2026-08-02 Sun]\n")
                          text = "".join(lines)
                  path.write_text(text, encoding="utf-8")
                  changed.append(path)

          if not changed:
              raise SystemExit("Migration changed no research documents")

          # Audit the entire Star-Lang research corpus for the field forms this
          # migration owns. DSL/declaration names are intentionally excluded.
          failures = []
          for path in docs:
              text = path.read_text(encoding="utf-8")
              for number, line in enumerate(text.splitlines(), start=1):
                  if (":required" in line or ":optional" in line):
                      match = field_decl.match(line)
                      if match:
                          failures.append(f"{path}:{number}: kebab-case field declaration {match.group(2)}")
                  if quoted_key.search(line):
                      failures.append(f"{path}:{number}: kebab-case serialized key")
              for old in wire_fields:
                  if re.search(r":" + re.escape(old) + r"\b", text):
                      failures.append(f"{path}: kebab-case wire field :{old}")
              if "Hyphenated Star-Lang field names" in text or "=message_type=" in text:
                  failures.append(f"{path}: obsolete field-naming prose")

          if failures:
              raise SystemExit("\n".join(failures))

          print("Changed research documents:")
          for path in changed:
              print(path)
          PY

          rm .github/workflows/migrate-star-lang-fields-to-camelcase.yml

          git config user.name "starintel-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add roam/research/star-lang .github/workflows/migrate-star-lang-fields-to-camelcase.yml
          git commit -m "docs(star-lang): adopt camelCase field names across research"
          git push origin HEAD:main
