name: Finalize Star-Lang camelCase field migration

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-star-lang-camelcase.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore research baseline and migrate field positions only
        shell: bash
        run: |
          set -euo pipefail

          git checkout c9ddc36107a051a769b91375f6813956e204a122 -- roam/research/star-lang
          rm -f .github/workflows/migrate-star-lang-fields-to-camelcase.yml
          rm -f .github/workflows/correct-star-lang-camelcase-scope.yml

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("roam/research/star-lang")
          docs = sorted(root.glob("STAR-LANG-RESEARCH-*.org"))

          def camel(name: str) -> str:
              parts = name.split("-")
              return parts[0] + "".join(part[:1].upper() + part[1:] for part in parts[1:])

          field_decl = re.compile(r"^(\s*)\(([a-z][a-z0-9]*(?:-[a-z0-9]+)+)(?=\s)")
          quoted_key = re.compile(r'"([a-z][a-z0-9]*(?:-[a-z0-9]+)+)"(?=[ \t]*(?:\.|:))')
          block_re = re.compile(r"(#\+begin_src[^\n]*\n)(.*?)(#\+end_src)", re.I | re.S)
          envelope_markers = (
              ":star-command", ":star-version", ":message-id", ":messageId",
              ":message-type", ":messageType", ":correlation-id", ":correlationId",
              ":causation-id", ":causationId", ":idempotency-key", ":idempotencyKey",
              ":reply-to", ":replyTo", '"message-id"', '"messageId"'
          )
          line_plist_key = re.compile(
              r"^(\s*\(?):([a-z][a-z0-9]*(?:-[a-z0-9]+)+)(?=[ \t]+\S)",
              re.M,
          )

          changed = []
          for path in docs:
              original = path.read_text(encoding="utf-8")
              text = original

              # Declared document/message fields: first symbol on a required/optional field line.
              lines = []
              for line in text.splitlines(keepends=True):
                  if ":required" in line or ":optional" in line:
                      match = field_decl.match(line)
                      if match:
                          old = match.group(2)
                          line = line[:match.start(2)] + camel(old) + line[match.end(2):]
                  lines.append(line)
              text = "".join(lines)

              # Serialized JSON/alist keys on the same line only.
              text = quoted_key.sub(lambda m: '"' + camel(m.group(1)) + '"', text)

              # In identified envelope/data blocks, convert only plist keys at line start.
              def rewrite_block(match: re.Match) -> str:
                  head, body, tail = match.groups()
                  if not any(marker in body for marker in envelope_markers):
                      return match.group(0)
                  body = line_plist_key.sub(
                      lambda m: m.group(1) + ":" + camel(m.group(2)),
                      body,
                  )
                  return head + body + tail

              text = block_re.sub(rewrite_block, text)

              text = text.replace(
                  "Hyphenated Star-Lang field names remain exact dictionary keys instead of being silently renamed.",
                  "Star-Lang field names use lower camelCase and remain exact dictionary keys; generators do not silently rename them."
              )
              text = text.replace("exact source field strings", "exact lower-camelCase source field strings")
              text = text.replace("quoted source field names", "lower-camelCase source field names")
              text = text.replace("Python preserves exact source keys", "Python preserves exact lower-camelCase source keys")
              text = text.replace("=message_type=", "=messageType=")

              if path.name == "STAR-LANG-RESEARCH-008-core-surface-and-wire-protocol.org":
                  naming = (
                      "* Field Naming\n\n"
                      "Star-Lang document fields, message-payload fields, and wire-envelope keys use lower camelCase. "
                      "Examples include =candidateId=, =messageId=, =correlationId=, and =replyTo=. "
                      "The compiler preserves these names exactly through normalized IR, manifests, serialization, and generated bindings.\n\n"
                      "DSL forms and named declarations are not fields. Forms and identifiers such as =spec-library=, "
                      "=ingest-page=, scalar/type names, predicates, actors, compiler options, and restart names may remain kebab-case. "
                      "Kebab-case field declarations are invalid and must produce a structured compiler diagnostic.\n\n"
                  )
                  text = text.replace("* Concrete Surface\n", naming + "* Concrete Surface\n", 1)
                  old_table = (
                      "| Version | Date       | Description of change                                      | Did nsaspy approve it |\n"
                      "|---------+------------+------------------------------------------------------------+-----------------------|\n"
                      "| 0.1.1   | 2026-08-02 | Record nsaspy approval of core surface and wire protocol   | Yes                   |\n"
                      "| 0.1.0   | 2026-07-22 | Define core surface and initial language-neutral protocol  | Superseded            |"
                  )
                  new_table = (
                      "| Version | Date       | Description of change                                                | Did nsaspy approve it |\n"
                      "|---------+------------+----------------------------------------------------------------------+-----------------------|\n"
                      "| 0.1.2   | 2026-08-02 | Adopt lower camelCase fields across surface and wire contracts       | Yes                   |\n"
                      "| 0.1.1   | 2026-08-02 | Record nsaspy approval of core surface and wire protocol             | Superseded            |\n"
                      "| 0.1.0   | 2026-07-22 | Define core surface and initial language-neutral protocol            | Superseded            |"
                  )
                  if old_table not in text:
                      raise SystemExit("research 008 table mismatch")
                  text = text.replace(old_table, new_table, 1)

              if path.name == "STAR-LANG-RESEARCH-009-canonical-json-and-generated-bindings.org":
                  naming = (
                      "* Field Naming\n\n"
                      "All document fields, message-payload fields, and serialized envelope keys use lower camelCase. "
                      "Canonical JSON and generated bindings preserve the source spelling exactly; they do not translate kebab-case fields at generation time. "
                      "A kebab-case field is rejected during parsing or semantic validation. Declaration and type identifiers remain outside this rule.\n\n"
                  )
                  text = text.replace("* Canonical JSON\n", naming + "* Canonical JSON\n", 1)
                  text = text.replace(
                      "13. generated Python bindings compile\n",
                      "13. generated Python bindings compile\n14. kebab-case field declarations fail before binding generation\n",
                      1,
                  )

              if text != original:
                  if "#+last_modified:" not in text:
                      rows = text.splitlines(keepends=True)
                      index = next((i + 1 for i, row in enumerate(rows) if row.startswith("#+status:")), None)
                      if index is not None:
                          rows.insert(index, "#+last_modified: [2026-08-02 Sun]\n")
                          text = "".join(rows)
                  path.write_text(text, encoding="utf-8")
                  changed.append(path)

          # Tight audit: declarations, serialized keys, and line-start envelope keys.
          failures = []
          for path in docs:
              text = path.read_text(encoding="utf-8")
              for number, line in enumerate(text.splitlines(), 1):
                  if ":required" in line or ":optional" in line:
                      match = field_decl.match(line)
                      if match:
                          failures.append(f"{path}:{number}: {match.group(2)}")
                  if quoted_key.search(line):
                      failures.append(f"{path}:{number}: serialized key")
              for block in block_re.finditer(text):
                  body = block.group(2)
                  if any(marker in body for marker in envelope_markers):
                      match = line_plist_key.search(body)
                      if match:
                          failures.append(f"{path}: envelope key {match.group(2)}")
              if "Hyphenated Star-Lang field names" in text or "=message_type=" in text:
                  failures.append(f"{path}: obsolete naming prose")

          if failures:
              raise SystemExit("\n".join(failures))

          print("Changed:")
          for path in changed:
              print(path)
          PY

          rm -f .github/workflows/finalize-star-lang-camelcase.yml

          git config user.name "starintel-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add roam/research/star-lang .github/workflows
          git commit -m "docs(star-lang): enforce camelCase field naming"
          git push origin HEAD:main
