name: Approve STAR-LANG-RESEARCH-008

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/approve-star-lang-research-008.yml

permissions:
  contents: write

jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark STAR-LANG-RESEARCH-008 approved
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("roam/research/star-lang/STAR-LANG-RESEARCH-008-core-surface-and-wire-protocol.org")
          text = path.read_text(encoding="utf-8")

          if "#+status: REVIEW" not in text:
              raise SystemExit("Expected REVIEW status")
          text = text.replace("#+status: REVIEW", "#+status: APPROVED", 1)

          old_tags = "#+filetags: :starintel:star-lang:dsl:schemas:messages:actors:wire-protocol:common-lisp:research:"
          new_tags = old_tags + "approved:"
          if old_tags not in text:
              raise SystemExit("Expected filetags line")
          text = text.replace(old_tags, new_tags, 1)

          metadata = "#+todo: TODO RESEARCHING REVIEW BLOCKED APPROVED | DONE REJECTED\n#+last_modified: [2026-08-02 Sun]\n\n| Version | Date       | Description of change                                      | Did nsaspy approve it |\n|---------+------------+------------------------------------------------------------+-----------------------|\n| 0.1.1   | 2026-08-02 | Record nsaspy approval of core surface and wire protocol   | Yes                   |\n| 0.1.0   | 2026-07-22 | Define core surface and initial language-neutral protocol  | Superseded            |"
          text = text.replace(new_tags, new_tags + "\n" + metadata, 1)

          path.write_text(text, encoding="utf-8")
          PY

          rm .github/workflows/approve-star-lang-research-008.yml

          git config user.name "starintel-approval-bot"
          git config user.email "actions@users.noreply.github.com"
          git add roam/research/star-lang/STAR-LANG-RESEARCH-008-core-surface-and-wire-protocol.org .github/workflows/approve-star-lang-research-008.yml
          git commit -m "docs(star-lang): approve research 008"
          git push origin HEAD:main
