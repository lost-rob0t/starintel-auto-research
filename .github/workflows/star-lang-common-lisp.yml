name: Star-Lang Common Lisp Research

on:
  pull_request:
    paths:
      - "prototypes/star-lang/**"
      - "roam/design/star-lang/**"
      - "roam/implement/star-lang/**"
      - "roam/indexes/star-lang/**"
      - "roam/research/star-lang/**"
      - ".github/workflows/star-lang-common-lisp.yml"
  push:
    branches:
      - main
    paths:
      - "prototypes/star-lang/**"
      - "roam/design/star-lang/**"
      - "roam/implement/star-lang/**"
      - "roam/indexes/star-lang/**"
      - "roam/research/star-lang/**"
      - ".github/workflows/star-lang-common-lisp.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-research-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Enforce Common Lisp-only implementation boundary
        shell: bash
        run: |
          set -euo pipefail

          forbidden_dirs=(
            prototypes/star-lang/racket
            prototypes/star-lang/scheme
            prototypes/star-lang/guile
          )

          for path in "${forbidden_dirs[@]}"; do
            if [[ -e "$path" ]]; then
              echo "forbidden alternate Star-Lang implementation path: $path" >&2
              exit 1
            fi
          done

          if [[ -d prototypes/star-lang ]]; then
            mapfile -t forbidden_sources < <(
              find prototypes/star-lang -type f \
                \( -name '*.rkt' -o -name '*.scm' -o -name '*.ss' \) \
                -print
            )
            if ((${#forbidden_sources[@]})); then
              printf 'forbidden alternate Star-Lang source: %s\n' "${forbidden_sources[@]}" >&2
              exit 1
            fi
          fi

      - name: Validate canonical repository boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          implementation = Path("roam/indexes/star-lang/STAR-LANG-INDEX-001-implementation.org")
          research = Path("roam/indexes/star-lang/STAR-LANG-INDEX-000-language-research.org")
          required = {
              implementation: (
                  "https://github.com/lost-rob0t/star-lang",
                  "Common Lisp is the sole approved Star-Lang implementation language",
                  "prototypes/star-lang/common-lisp/",
              ),
              research: (
                  "https://github.com/lost-rob0t/star-lang",
                  "Every alternate implementation language is DENIED",
              ),
          }

          for path, tokens in required.items():
              text = path.read_text(encoding="utf-8")
              missing = [token for token in tokens if token not in text]
              if missing:
                  raise SystemExit(f"{path}: missing required boundary tokens: {missing}")

          live_sources = list(Path("prototypes/star-lang").glob("**/*.lisp")) if Path("prototypes/star-lang").exists() else []
          if live_sources:
              raise SystemExit(
                  "live Star-Lang implementation remains in the research repository: "
                  + ", ".join(str(path) for path in live_sources[:10])
              )

          print("Star-Lang research/canonical-repository boundary validated")
          PY
