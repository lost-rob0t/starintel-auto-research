name: Amend Star-Lang research 009 numeric model

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/amend-star-lang-research-009-numeric-model.yml

permissions:
  contents: write

jobs:
  amend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reopen numeric model for float support
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("roam/research/star-lang/STAR-LANG-RESEARCH-009-canonical-json-and-generated-bindings.org")
          text = path.read_text(encoding="utf-8")

          marker = "#+filetags: :starintel:star-lang:json:wire-protocol:python:typescript:bindings:compiler:research:\n"
          table = (
              "\n| Version | Date       | Description of change                                                | Did nsaspy approve it |\n"
              "|---------+------------+----------------------------------------------------------------------+-----------------------|\n"
              "| 0.2.0   | 2026-08-02 | Reopen numeric model: allow floats for geo and approximate measures  | No                    |\n"
          )
          if table not in text:
              if marker not in text:
                  raise SystemExit("metadata marker missing")
              text = text.replace(marker, marker + table, 1)

          old = """* Canonical JSON

Canonical output uses:

- lexicographically sorted object keys
- declaration order for arrays
- UTF-8 strings with JSON escaping
- integers as JSON numbers
- booleans as JSON booleans
- exact decimal values as JSON strings
- omitted absent optional envelope members
- qualified Star-Lang identifiers as wire type names

Floating-point values are not accepted as canonical numeric values. Financial and other decimal fields use strings so runtimes do not silently round values while crossing language boundaries.
"""
          new = """* Numeric Model

Star-Lang distinguishes approximate binary floating-point values from exact base-10 decimal values.

- =integer= is exact and serializes as a JSON number.
- =float= is an approximate finite IEEE-754 binary64 value and serializes as a JSON number. It is appropriate for latitude, longitude, altitude, accuracy, measurements, scores, and scientific data where approximate arithmetic is expected.
- =decimal= is an exact base-10 value and serializes as a canonical JSON string. It is appropriate for money, rates, quantities with contractual scale, and any value that must not change through binary floating-point conversion.

Float serialization rejects NaN, positive infinity, and negative infinity because JSON has no interoperable representation for them. Finite float values use a deterministic shortest round-trip decimal representation. Negative zero is canonicalized to =0= so equivalent values do not produce different canonical bytes.

The current Star-CL geo schema uses decimal latitude, longitude, altitude, and accuracy fields. That schema should migrate those approximate geospatial fields to =float= while retaining =decimal= for exact fixed-precision domains.

* Canonical JSON

Canonical output uses:

- lexicographically sorted object keys
- declaration order for arrays
- UTF-8 strings with JSON escaping
- integers as JSON numbers
- finite float values as canonical JSON numbers
- booleans as JSON booleans
- exact decimal values as canonical JSON strings
- omitted absent optional envelope members
- qualified Star-Lang identifiers as wire type names

Numeric encoding follows the declared schema type. A JSON number is valid for an =integer= or =float= field but not for an exact =decimal= field. A decimal string is valid for =decimal= but must not be silently accepted for =float=.
"""
          if old not in text:
              raise SystemExit("old canonical numeric section missing")
          text = text.replace(old, new, 1)

          text = text.replace(
              "- integer and boolean values\n- precision-safe decimal strings\n",
              "- integer and boolean values\n- finite float values for float-typed fields\n- precision-safe decimal strings for decimal-typed fields\n",
              1,
          )

          text = text.replace(
              "Star-Lang field names use lower camelCase and remain exact dictionary keys; generators do not silently rename them. Scalar and enumeration type names become PascalCase aliases. Decimal wire types map to =str=.",
              "Star-Lang field names use lower camelCase and remain exact dictionary keys; generators do not silently rename them. Scalar and enumeration type names become PascalCase aliases. Float wire types map to Python =float=; decimal wire types map to =str=.",
              1,
          )

          text = text.replace(
              "Decimal wire types map to =string= for the same precision rule used by Python and canonical JSON.",
              "Float wire types map to TypeScript =number=. Decimal wire types map to =string= for the same exactness rule used by Python and canonical JSON.",
              1,
          )

          old_tests = """1. repeated manifest serialization is byte-identical
2. qualified FEC type names survive serialization
3. envelope object keys are canonicalized
4. list fields encode as JSON arrays
5. decimal strings pass and numeric decimal values fail
6. invalid enum values fail
7. Python preserves exact lower-camelCase source keys
8. Python document bindings include inherited fields
9. TypeScript preserves interface inheritance
10. Python and TypeScript both map decimal wire values to strings
11. actor contracts appear in both generated languages
12. generated manifest and envelope files parse as JSON
13. generated Python bindings compile
14. kebab-case field declarations fail before binding generation
"""
          new_tests = """1. repeated manifest serialization is byte-identical
2. qualified FEC type names survive serialization
3. envelope object keys are canonicalized
4. list fields encode as JSON arrays
5. geo latitude, longitude, altitude, and accuracy float values encode as JSON numbers
6. finite float values round-trip through canonical binary64 serialization
7. NaN and positive or negative infinity fail validation
8. negative zero canonicalizes to JSON =0=
9. decimal strings pass and JSON-number decimal values fail
10. float fields reject decimal strings unless an explicit conversion is requested
11. invalid enum values fail
12. Python preserves exact lower-camelCase source keys
13. Python document bindings include inherited fields
14. TypeScript preserves interface inheritance
15. Python and TypeScript map float values to native numeric types and decimal values to strings
16. actor contracts appear in both generated languages
17. generated manifest and envelope files parse as JSON
18. generated Python bindings compile
19. kebab-case field declarations fail before binding generation
"""
          if old_tests not in text:
              raise SystemExit("old tests section missing")
          text = text.replace(old_tests, new_tests, 1)

          text = text.replace(
              "- select the final Star-Lang host implementation\n",
              "- select the final Star-Lang host implementation\n- define arbitrary-precision binary floating-point types beyond binary64\n",
              1,
          )

          path.write_text(text, encoding="utf-8")
          PY

          rm .github/workflows/amend-star-lang-research-009-numeric-model.yml
          git config user.name "starintel-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add roam/research/star-lang/STAR-LANG-RESEARCH-009-canonical-json-and-generated-bindings.org .github/workflows/amend-star-lang-research-009-numeric-model.yml
          git commit -m "docs(star-lang): reopen 009 for float numeric model"
          git push origin HEAD:main
