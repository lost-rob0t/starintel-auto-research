name: Government Data Design

on:
  pull_request:
    paths:
      - "fixtures/government-data/**"
      - "roam/design/auto-research/STAR-RESEARCH-PIPELINE-003-government-data-acquisition-actors.org"
      - "roam/design/auto-research/STAR-RESEARCH-PIPELINE-004*.org"
      - "roam/design/government-data/**"
      - "roam/runbooks/government-data/**"
      - "roam/todos/government-data/**"
      - "tools/generate-government-jurisdiction-todos.py"
      - "tools/validate-government-data-design.py"
      - ".github/workflows/government-data-design.yml"
  push:
    branches:
      - main
    paths:
      - "fixtures/government-data/**"
      - "roam/design/auto-research/STAR-RESEARCH-PIPELINE-003-government-data-acquisition-actors.org"
      - "roam/design/auto-research/STAR-RESEARCH-PIPELINE-004*.org"
      - "roam/design/government-data/**"
      - "roam/runbooks/government-data/**"
      - "roam/todos/government-data/**"
      - "tools/generate-government-jurisdiction-todos.py"
      - "tools/validate-government-data-design.py"
      - ".github/workflows/government-data-design.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Validate contracts, fixtures, and offline reproduction
        run: python tools/validate-government-data-design.py
