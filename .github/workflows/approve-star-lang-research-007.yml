name: Approve STAR-LANG-RESEARCH-007

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/approve-star-lang-research-007.yml

permissions:
  contents: write

jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark STAR-LANG-RESEARCH-007 approved
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("roam/research/star-lang/STAR-LANG-RESEARCH-007-normalized-ir-and-cl-gserver-binding.org")
          text = path.read_text(encoding="utf-8")

          replacements = {
              "#+status: REVIEW": "#+status: APPROVED",
              "#+filetags: :starintel:research:star-lang:compiler:ir:common-lisp:actors:cl-gserver:sento:domain-servers:": "#+filetags: :starintel:research:star-lang:compiler:ir:common-lisp:actors:cl-gserver:sento:domain-servers:approved:",
              "#+todo: TODO RESEARCHING REVIEW BLOCKED | DONE REJECTED": "#+todo: TODO RESEARCHING REVIEW BLOCKED APPROVED | DONE REJECTED\n#+last_modified: [2026-08-02 Sun]",
              "|---------+------------+------------------------------------------------------------------------+-----------------------|\n| 0.1.0   | 2026-07-22 | Define normalized IR v1 and a declarative cl-gserver adapter prototype | No                    |": "|---------+------------+------------------------------------------------------------------------+-----------------------|\n| 0.1.1   | 2026-08-02 | Record nsaspy approval of normalized IR and cl-gserver binding         | Yes                   |\n| 0.1.0   | 2026-07-22 | Define normalized IR v1 and a declarative cl-gserver adapter prototype | Superseded            |",
          }

          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"Expected exactly one match for: {old!r}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY

          rm .github/workflows/approve-star-lang-research-007.yml

          git config user.name "starintel-approval-bot"
          git config user.email "actions@users.noreply.github.com"
          git add roam/research/star-lang/STAR-LANG-RESEARCH-007-normalized-ir-and-cl-gserver-binding.org .github/workflows/approve-star-lang-research-007.yml
          git commit -m "docs(star-lang): approve research 007"
          git push origin HEAD:main
