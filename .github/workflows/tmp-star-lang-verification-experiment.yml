name: Temporary StarLang Verification Experiment

on:
  push:
    branches:
      - agent/star-lang-verification-experiment-research

permissions:
  contents: read

jobs:
  formal-experiment:
    runs-on: ubuntu-latest
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run TLA+ parser and TLC
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p formal-evidence
          curl -L --fail --retry 3 \
            -o "$RUNNER_TEMP/tla2tools.jar" \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "bee4a54f3ee3d4afc347c3240ec2d9e93b075104  $RUNNER_TEMP/tla2tools.jar" | sha1sum -c -
          java -cp "$RUNNER_TEMP/tla2tools.jar" tla2sany.SANY \
            experiments/star-lang/verification/StarActorIngest.tla \
            | tee formal-evidence/tla-sany.log
          java -XX:+UseParallelGC -cp "$RUNNER_TEMP/tla2tools.jar" tlc2.TLC \
            -workers 1 \
            -config experiments/star-lang/verification/StarActorIngest.cfg \
            experiments/star-lang/verification/StarActorIngest.tla \
            | tee formal-evidence/tlc.log
          sha1sum "$RUNNER_TEMP/tla2tools.jar" | tee formal-evidence/tla2tools.sha1
          sha256sum \
            experiments/star-lang/verification/StarActorIngest.tla \
            experiments/star-lang/verification/StarActorIngest.cfg \
            | tee formal-evidence/tla-fixtures.sha256

      - name: Run cvc5 QF_LIA fixture and produce Alethe proof
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            -o "$RUNNER_TEMP/cvc5.zip" \
            https://github.com/cvc5/cvc5/releases/download/cvc5-1.3.4/cvc5-Linux-x86_64-libcxx-static.zip
          echo "6cbc48ad8812b72abed32418a9f8b928c56c776d67377e63bc6b8f6bb2e40ac5  $RUNNER_TEMP/cvc5.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/cvc5"
          unzip -q "$RUNNER_TEMP/cvc5.zip" -d "$RUNNER_TEMP/cvc5"
          CVC5_BIN="$(find "$RUNNER_TEMP/cvc5" -type f -name cvc5 | head -n 1)"
          chmod +x "$CVC5_BIN"
          "$CVC5_BIN" --version | tee formal-evidence/cvc5-version.log
          "$CVC5_BIN" experiments/star-lang/verification/person-minor-unsat.smt2 \
            | tee formal-evidence/cvc5-result.log
          grep -qx 'unsat' formal-evidence/cvc5-result.log
          "$CVC5_BIN" \
            --dump-proofs \
            --proof-format-mode=alethe \
            experiments/star-lang/verification/person-minor-unsat.smt2 \
            > formal-evidence/person-minor-unsat.alethe.raw
          head -n 1 formal-evidence/person-minor-unsat.alethe.raw | grep -qx 'unsat'
          tail -n +2 formal-evidence/person-minor-unsat.alethe.raw \
            > formal-evidence/person-minor-unsat.alethe
          test -s formal-evidence/person-minor-unsat.alethe
          sha256sum \
            experiments/star-lang/verification/person-minor-unsat.smt2 \
            formal-evidence/person-minor-unsat.alethe \
            | tee formal-evidence/smt-evidence.sha256

      - name: Build pinned Carcara and independently check Alethe proof
        shell: bash
        run: |
          set -euo pipefail
          rustc --version | tee formal-evidence/rust-version.log
          cargo --version | tee -a formal-evidence/rust-version.log
          cargo install \
            --git https://github.com/ufmg-smite/carcara.git \
            --rev 6624ea80cf1985ada473c0705869c78353e4282d \
            --locked \
            --root "$RUNNER_TEMP/carcara"
          "$RUNNER_TEMP/carcara/bin/carcara" --version \
            | tee formal-evidence/carcara-version.log
          set +e
          "$RUNNER_TEMP/carcara/bin/carcara" check \
            formal-evidence/person-minor-unsat.alethe \
            experiments/star-lang/verification/person-minor-unsat.smt2 \
            2>&1 | tee formal-evidence/carcara-check.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "$rc" | tee formal-evidence/carcara-exit-code.txt
          if [ "$rc" -ne 0 ]; then
            echo "Independent Alethe check failed; retain as research evidence, not a solver certificate." >&2
          fi

      - name: Upload formal research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: star-lang-verification-formal-evidence
          path: formal-evidence/
          if-no-files-found: error
