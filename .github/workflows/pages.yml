name: Org-roam Pages

on:
  push:
    branches: [main]
    paths:
      - "roam/**"
      - "lisp/starintel/**"
      - "pages/**"
      - "scripts/**"
      - "tests/**"
      - "skills/**"
      - ".github/workflows/pages.yml"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "CODEX.md"
      - "README.org"
      - "README.md"
  pull_request:
    branches: [main]
    paths:
      - "roam/**"
      - "lisp/starintel/**"
      - "pages/**"
      - "scripts/**"
      - "tests/**"
      - "skills/**"
      - ".github/workflows/pages.yml"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "CODEX.md"
      - "README.org"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  PLANTUML_VERSION: "1.2026.6"
  PLANTUML_SHA256: "89948f14c93756c7a3fb7b69078ff37e8489fd79dd430c582b931e2f65358690"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Resolve validation base
        id: validation-base
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          elif [[ "${{ github.event.before }}" =~ ^0+$ ]] || [[ -z "${{ github.event.before }}" ]]; then
            base="$(git rev-parse HEAD^)"
          else
            base="${{ github.event.before }}"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "Validation base: $base"

      - name: Validate Python and shell syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/_roamlib.py \
            scripts/implement.py \
            scripts/mark-design.py \
            scripts/sync.py \
            scripts/validate-docs.py \
            scripts/validate-changed-docs.py \
            scripts/enhance-pages.py \
            scripts/check-pages-links.py \
            scripts/research_queue.py \
            scripts/research_approval_migration.py \
            scripts/list-unreviewed-research.py \
            scripts/build-research-pending.py
          bash -n scripts/publish-pages
          node --check pages/static/site.js
          node --check pages/static/enhancements.js
          node --check pages/static/research-pending.js

      - name: Run repository tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Synchronize repository metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/sync.py
          python3 scripts/research_approval_migration.py --check --verify
          git diff --exit-code -- . ':(exclude)_site/**' ':(exclude).cache/**'

      - name: Validate changed repository documents
        shell: bash
        env:
          VALIDATION_BASE: ${{ steps.validation-base.outputs.base }}
        run: |
          set -euo pipefail
          # Full maintenance checks remain available as:
          # python3 scripts/sync.py --check
          # python3 scripts/validate-docs.py
          python3 scripts/validate-changed-docs.py \
            --changed-since "$VALIDATION_BASE" \
            --audit-date "$(date -u +%F)"

      - name: Install Emacs and pinned PlantUML
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq >/tmp/apt-update.log
          sudo DEBIAN_FRONTEND=noninteractive apt-get install --yes --quiet \
            emacs-nox graphviz sqlite3 default-jre-headless curl >/tmp/apt-install.log
          curl --fail --silent --show-error --location \
            "https://github.com/plantuml/plantuml/releases/download/v${PLANTUML_VERSION}/plantuml-${PLANTUML_VERSION}.jar" \
            --output /tmp/plantuml.jar
          printf '%s  %s\n' "$PLANTUML_SHA256" /tmp/plantuml.jar | sha256sum --check
          sudo install -m 0644 /tmp/plantuml.jar /opt/plantuml.jar
          sudo tee /usr/local/bin/plantuml >/dev/null <<'EOF'
          #!/usr/bin/env bash
          exec java -jar /opt/plantuml.jar "$@"
          EOF
          sudo chmod +x /usr/local/bin/plantuml
          emacs --version | head -1
          plantuml -version | head -1

      - name: Build complete Org-roam site
        shell: bash
        run: |
          set +e
          bash scripts/publish-pages >pages-build.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::group::Complete-site build failure"
            tail -n 80 pages-build.log
            echo "::endgroup::"
            exit "$status"
          fi
          tail -n 80 pages-build.log

      - name: Upload Org-roam build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: org-roam-pages-build-log
          path: pages-build.log
          if-no-files-found: error

      - name: Validate generated site
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check-pages-links.py _site
          grep -Fxq 'auto-research.starintel.actor' _site/CNAME
          test -s _site/deployment.json
          test -s _site/research-pending/index.html
          if git ls-files '_site/**' '.cache/**' | grep -q .; then
            echo "::error::Generated _site or .cache output must not be tracked"
            git ls-files '_site/**' '.cache/**'
            exit 1
          fi

      - name: Verify canonical research queue
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/research_approval_migration.py --check --verify
          python3 - <<'PY'
          import re
          import sys
          from pathlib import Path

          root = Path.cwd()
          page = (root / "_site/research-pending/index.html").read_text(encoding="utf-8")
          rows = re.findall(r'<tr class="research-row(?: [^"]+)?"', page)
          if "is-legacy" in page:
              raise SystemExit("research-pending contains an unmigrated legacy row")
          if '<th>Repository</th>' not in page:
              raise SystemExit("research-pending is missing its repository column")
          if not rows:
              raise SystemExit("research-pending contains no canonical pending rows")
          print(f"research_pending=PASS canonical_rows={len(rows)} legacy_rows=0")
          PY

      - name: Verify CAPTCHA publication artifacts
        shell: bash
        run: |
          set -euo pipefail
          for page in \
            notes/indexes/starintel-pro-actors/STAR-PRO-INDEX-001-captcha-service-actors.html \
            notes/design/star-server/STAR-CAPTCHA-000-broker-router.html \
            notes/design/star-server/STAR-CAPTCHA-001-detection-resolution-orchestrator.html \
            notes/research/starintel-pro-actors/STAR-PRO-RESEARCH-006-captcha-challenge-provider-landscape.html
          do
            test -s "_site/$page" || {
              echo "::error file=$page::Expected published CAPTCHA page is missing"
              exit 1
            }
          done

      - name: Verify GitHub Pages is enabled
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api "repos/${GITHUB_REPOSITORY}/pages" >/tmp/pages.json 2>/tmp/pages-error.log; then
            cat /tmp/pages-error.log
            echo "::error::GitHub Pages is not enabled for workflow publishing. Run 'bash scripts/configure-pages' once with an administrator-authenticated gh CLI, then rerun this workflow."
            exit 1
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path

          pages = json.loads(Path('/tmp/pages.json').read_text())
          build_type = pages.get('build_type')
          if build_type != 'workflow':
              raise SystemExit(
                  "GitHub Pages exists but build_type is not 'workflow'. "
                  "Run 'bash scripts/configure-pages' once."
              )
          print(f"GitHub Pages enabled: {pages.get('html_url', 'URL pending')}")
          PY

      - name: Configure GitHub Pages metadata
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
